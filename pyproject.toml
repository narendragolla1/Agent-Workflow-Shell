[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-shell"
version = "0.1.0"
description = "Structured, quality-enforced development workflows via slash commands, persistent memory, and rule generation for Claude Code / Codex CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
agent-workflow-shell = "agent_workflow_shell.cli:main"

[tool.setuptools.packages.find]
include = ["agent_workflow_shell*"]

[tool.pytest.ini_options]
testpaths = ["agent_workflow_shell/tests"]
